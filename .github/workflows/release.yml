name: Release

# A pushed version tag releases: the tag is the version (MinVer), see docs/releasing.md.
# A manual run (Actions > Release > Run workflow) is a dry run: everything up to the push, nothing published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-26.04
    environment: nuget # the owner approves every run; the nuget.org trusted publishing policy names this environment
    permissions:
      contents: write # create the GitHub Release
      id-token: write # trusted publishing to nuget.org (OIDC), no stored API key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # MinVer reads the tag
      - name: Require the tagged commit to be on main
        if: github.event_name == 'push'
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "The tagged commit is not on main. Merge first, then tag main." >&2
            exit 1
          fi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build
      - run: dotnet pack src/BatInspectorPublisher -c Release --no-build -o artifacts

      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then version="${TAG#v}"; else version="Unreleased"; fi
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && ! ls artifacts/BatInspectorPublisher."$version".nupkg >/dev/null 2>&1; then
            echo "The packed version does not match the tag $TAG" >&2
            ls artifacts >&2
            exit 1
          fi
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      # Everything below runs for a tag only; a manual run stops here.
      # Log in right before the push: the temporary key lives one hour and each OIDC token is used once.
      - if: github.event_name == 'push'
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to nuget.org
        if: github.event_name == 'push'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          flag=""
          if [[ "$version" == *-* ]]; then flag="--prerelease"; fi
          gh release create "$TAG" artifacts/*.nupkg artifacts/*.snupkg --title "$version" --notes-file release-notes.md $flag
